    <canvas id="kan" width="800" height="800" style="border: 1px solid black">
    </canvas>
    <script>
      let c = document.getElementById("kan");
      let ctx = c.getContext("2d");
      ctx.beginPath();
      ctx.rect(150, 150, 450, 300);
      ctx.fillStyle = "blue";
      ctx.fill();

      ctx.beginPath();
      ctx.rect(160, 290, 90, 160);
      ctx.fillStyle = "white";
      ctx.fill();

      ctx.beginPath();
      ctx.rect(340, 290, 160, 100);
      ctx.fillStyle = "white";
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(150, 150);
      ctx.lineTo(375, 50);
      ctx.lineTo(600, 150);
      ctx.fillStyle = "red";
      ctx.fill();
      ctx.strokeStyle = "red";
      ctx.stroke();
    </script>
  </body>
