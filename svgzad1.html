<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG zadatci</title>
  </head>
  <body>
    <h1>Zadatak 1</h1>
    <svg width="600" height="700">
      <rect
        x="30"
        y="30"
        width="480"
        height="500"
        fill="lightblue"
        stroke="black"
        stroke-width="3"
      />
      <circle cx="410" cy="110" r="50" fill="yellow" stroke="yellow" />
      <rect
        x="100"
        y="350"
        width="200"
        height="60"
        fill="brown"
        stroke="brown"
      />

      <polygon points="140,168 187,150 187,200" fill="green" stroke="black" />
      <polygon points="199,205 117,340 287,340" fill="white" />
      <rect
        x="190"
        y="150"
        width="20"
        height="200"
        fill="black"
        stroke="brown"
      />
      <rect x="30" y="410" width="480" height="120" fill="blue" />
    </svg>

    <br />
    <h1>Zadatak 2</h1>
    <svg width="600" height="700">
      <rect x="0" y="0" width="600" height="700" fill="#FFC3A0" />
      <ellipse cx="260" cy="600" rx="500" ry="180" fill="#fff6e9" />
      <polygon points="89,55 37,340 167,340" fill="green" />
      <rect x="90" y="340" width="20" height="90" fill="brown" />
      <polygon points="530,55 480,340 600,340" fill="green" />
      <rect x="530" y="340" width="20" height="90" fill="brown" />
      <polygon points="250,240 180,440 300,440" fill="green" />
      <rect x="230" y="440" width="20" height="90" fill="brown" />
      <polygon points="430,240 360,440 480,440" fill="green" />
      <rect x="410" y="440" width="20" height="90" fill="brown" />
    </svg>

    <br />
    <h1>Zadatak 3</h1>
    <svg width="600" height="700">
      <circle
        cx="250"
        cy="50"
        r="30"
        stroke="orange"
        fill="white"
        stroke-width="4"
      />
      <circle cx="250" cy="265" r="150" stroke="red" fill="red" />
      <rect x="200" y="78" width="100" height="50" fill="orange" />
    </svg>

    <br />
    <h1>Zadatak 4</h1>
    <svg width="600" height="700">
      <rect x="270" y="360" width="80" height="100" fill="brown" />
      <polygon points="315,250 106,365 524,365" fill="darkgreen" />
      <polygon points="315,154 158,280 472,280" fill="green" />
      <polygon points="315,62 210,184 420,184" fill="lightgreen" />
    </svg>

    <br />
    <h1>Zadatak 5</h1>
    <svg width="600" height="700">
      <circle cx="220" cy="150" r="60" fill="#B5651D" />
      <circle cx="195" cy="140" r="10" fill="white" />
      <circle cx="245" cy="140" r="10" fill="white" />
      <rect
        x="202"
        y="175"
        width="40"
        height="10"
        rx="5"
        stroke="white"
        stroke-width="3"
        fill="#B5651D"
      />
      <rect x="95" y="200" width="250" height="80" rx="40" fill="#B5651D" />

      <rect
        x="90"
        y="260"
        width="200"
        height="80"
        rx="40"
        ry="42.5"
        transform="rotate(78, 197.5, 360)"
        fill="#B5651D"
      />
      <rect
        x="200"
        y="200"
        width="200"
        height="80"
        rx="40"
        ry="42.5"
        transform="rotate(-78, 302.5, 360)"
        fill="#B5651D"
      />
      <circle cx="220" cy="240" r="10" fill="black" />
      <circle cx="220" cy="285" r="10" fill="black" />
    </svg>

    <br />
    <h1>Zadatak 6</h1>
    <svg width="600" height="700">
      <path
        d="M 250,250 L 380,160 A 190,190 0 1,0 380,340 Z"
        fill="yellow"
        stroke="black"
        stroke-width="8"
      />
      <circle cx="230" cy="190" r="30" fill="black" />
    </svg>
  </body>
</html>
