<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button>Prikaži poruku</button>
    <p></p>
    <script>
      let gumb = document.querySelector("button");
      let odlomak = document.querySelector("p");
      gumb.onclick = function () {
        odlomak.textContent = "Uspješno ste kliknuli gumb!";
      };
    </script>
  </body>
</html>
