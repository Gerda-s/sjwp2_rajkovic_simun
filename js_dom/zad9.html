<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p>Odlomak</p>
    <button>Gumb</button>
    <script>
      let odlomak = document.querySelector("p");
      let gumb = document.querySelector("button");
      gumb.onclick = function () {
        if (odlomak.style.display == "none") {
          odlomak.style.display = "block";
        } else {
          odlomak.style.display = "none";
        }
      };
    </script>
  </body>
</html>
