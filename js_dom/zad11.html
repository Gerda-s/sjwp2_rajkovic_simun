<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="https://www.wikipedia.org/" target="_blank">Wikipedija</a>
    <button>Gumb</button>
    <script>
        let link = document.querySelector("a");
        let gumb=document.querySelector("button");
        gumb.onclick=function(){
            link.setAttribute("href","https://github.com/");
            link.textContent="GitHub"
        }
    </script>
</body>
</html>
